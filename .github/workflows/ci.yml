name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # runner 的 stderr 是 cp1252；子进程/测试打印中文会 UnicodeEncodeError。
      # 强制 Python 全 UTF-8 模式（本地 GBK 控制台不受影响）
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 隔离运行时目录
        # 运行时数据（token / port / 状态）落到 runner 的临时目录，不碰源码树。
        # 注意 runner 上下文在 job 级 env 里取不到（只有 step 级能用），
        # 所以走 $GITHUB_ENV 注入而不是写在 jobs.<id>.env 下。
        run: echo "PIKACHU_HOME=$env:RUNNER_TEMP\pikachu-home" >> $env:GITHUB_ENV
        shell: pwsh
      - name: 安装依赖（桌宠 GUI 测试需要 Pillow）
        run: pip install pillow scipy
      - name: 单元测试
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 端到端测试（起真进程、走真 HTTP）
        run: python tests/e2e/run_all.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff 静态检查
        run: ruff check .

  install:
    # 装出来的包必须能在仓库外跑：这正是"运行时数据别写源码目录"要保证的
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（带 gui 附加依赖，让 doctor 能全绿）
        # 不装 Pillow 的话 doctor 会因为"贴图透明处理降级"返回 1，
        # 把这个 job 判失败——但它检查的是可选依赖，不该掩盖真问题
        run: pip install ".[gui]"
      - name: 在仓库外验证入口点
        working-directory: ${{ runner.temp }}
        run: pikachu --help
      - name: 在仓库外跑通「起总线 → 发通知 → 查历史 → 自检」
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Start-Process pikachu -ArgumentList "bus" | Out-Null
          Start-Sleep -Seconds 5
          pikachu send "CI 验证" "从仓库外发出" --level success
          pikachu history --n 5
          pikachu doctor

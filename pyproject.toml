[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu"
description = "本地通知总线 + 像素风气泡桌宠 + 健康提醒"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []          # 总线/提醒/适配器纯标准库

[project.optional-dependencies]
gui = ["pillow"]           # 桌宠贴图透明处理
assets = ["pillow", "scipy"]  # 重建转身帧资产（tools/build_turn_assets.py）

[tool.setuptools]
packages = ["pika", "pika.adapters", "pika.win", "pika.configs"]

[tool.setuptools.dynamic]
version = { attr = "pika.__version__" }

[tool.setuptools.package-data]
"pika.configs" = ["*.json"]
